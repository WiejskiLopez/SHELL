name: Session Service

on:
  push:
    tags:
      - "v*"
    paths:
      - "packaging/shell-platform/**"
      - "packaging/shell-session-service/**"
      - "scripts/build_session_service_artifacts.py"
      - "scripts/build_user_service_artifacts.py"
      - "scripts/verify_service_release.py"
      - "scripts/verify_user_service_image.py"
      - "shell/platform/**"
      - "shell/session_service/**"
      - "shell/tests/session_service/**"
      - "shell/tests/architecture/test_session_service_artifact_isolation.py"
      - "shell/tests/architecture/test_release_manifest.py"
      - ".github/workflows/session-service.yml"
  pull_request:
    paths:
      - "packaging/shell-platform/**"
      - "packaging/shell-session-service/**"
      - "scripts/build_session_service_artifacts.py"
      - "scripts/build_user_service_artifacts.py"
      - "scripts/verify_service_release.py"
      - "scripts/verify_user_service_image.py"
      - "shell/platform/**"
      - "shell/session_service/**"
      - "shell/tests/session_service/**"
      - "shell/tests/architecture/test_session_service_artifact_isolation.py"
      - "shell/tests/architecture/test_release_manifest.py"
      - ".github/workflows/session-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-test-release:
    name: Build and verify Session service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install repository test dependencies
        run: uv sync --locked

      - name: Verify Session dependency lockfile
        run: |
          lock_check_dir=$(mktemp -d)
          cp -R packaging/shell-platform "$lock_check_dir/shell-platform"
          cp -R packaging/shell-session-service "$lock_check_dir/shell-session-service"
          (cd "$lock_check_dir/shell-session-service" && uv lock --check)

      - name: Verify Session BC tests and artifact isolation
        run: uv run pytest shell/tests/architecture/test_session_service_artifact_isolation.py shell/tests/session_service -q

      - name: Verify independent service contract
        run: uv run pytest shell/tests/architecture/test_independent_service_contract.py -q

      - name: Verify production secret policy
        run: uv run pytest shell/tests/architecture/test_production_secret_policy.py -q

      - name: Verify public integration contracts
        run: uv run pytest shell/tests/contracts -q

      - name: Build independent wheels
        run: uv run python -m scripts.build_session_service_artifacts --output-dir dist/session-service

      - name: Build versioned Session service image
        run: |
          SESSION_SERVICE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('packaging/shell-session-service/pyproject.toml', 'rb'))['project']['version'])")
          docker build \
            --file shell/session_service/docker/Dockerfile \
            --tag shell-session-service:${{ github.sha }} \
            --tag shell-session-service:${SESSION_SERVICE_VERSION} \
            .

      - name: Verify isolated Session service image
        run: uv run python -m scripts.verify_user_service_image --image shell-session-service:${{ github.sha }} --service session

      - name: Generate release manifest
        run: uv run python -m scripts.verify_service_release --service session_service --package shell-session-service --image shell-session-service:${{ github.sha }} --output dist/session-service/release-manifest.json

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version and Git SHA image tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          SESSION_SERVICE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('packaging/shell-session-service/pyproject.toml', 'rb'))['project']['version'])")
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}/shell-session-service"
          docker tag shell-session-service:${{ github.sha }} ${IMAGE_NAME}:${SESSION_SERVICE_VERSION}
          docker tag shell-session-service:${{ github.sha }} ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:${SESSION_SERVICE_VERSION}
          docker push ${IMAGE_NAME}:${{ github.sha }}