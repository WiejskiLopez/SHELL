services:
  shell-dev:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../../shell_dev:/app/shell_dev

  shell-user:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    command:
      - python
      - -m
      - shell.user.framework.user.api
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --db-url
      - sqlite+aiosqlite:///shell_dev/user.db
      - --api-key
      - dev-user-key
    ports:
      - "8001:8001"
    volumes:
      - ../../shell_dev:/app/shell_dev
