name: shell-dev

x-shell-shared: &shell-shared
  restart: unless-stopped
  environment:
    SHELL_EVENTS_BROKER_URL: ${SHELL_EVENTS_BROKER_URL:-amqp://shell:shell@rabbitmq}

x-user-build: &user-build
  context: ..
  dockerfile: shell/user_service/docker/Dockerfile

x-definition-build: &definition-build
  context: ..
  dockerfile: shell/definition_service/docker/Dockerfile

x-session-build: &session-build
  context: ..
  dockerfile: shell/session_service/docker/Dockerfile

x-ingestion-build: &ingestion-build
  context: ..
  dockerfile: shell/ingestion_service/docker/Dockerfile

x-project-build: &project-build
  context: ..
  dockerfile: shell/project_service/docker/Dockerfile

x-scheduling-build: &scheduling-build
  context: ..
  dockerfile: shell/scheduling_service/docker/Dockerfile

x-execution-build: &execution-build
  context: ..
  dockerfile: shell/execution_service/docker/Dockerfile

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shell-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-shell}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-shell}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - shell_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  shell-user-api:
    build: *user-build
    <<: *shell-shared
    command: ["python", "-m", "shell.user_service.bootstrap.user.main", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  shell-user-worker:
    build: *user-build
    <<: *shell-shared
    command: ["python", "-m", "shell.user_service.bootstrap.user.main", "--worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      shell-user-api:
        condition: service_healthy

  shell-definition-api:
    build: *definition-build
    <<: *shell-shared
    command: ["python", "-m", "shell.definition_service.bootstrap.definition.main", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  shell-definition-worker:
    build: *definition-build
    <<: *shell-shared
    command: ["python", "-m", "shell.definition_service.bootstrap.definition.main", "--worker"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      shell-definition-api:
        condition: service_healthy

  shell-session-api:
