[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "shell"
version = "0.1.0"
description = "File-system-driven agent runtime shared library"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "dependency-injector>=4.49.1",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.51",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shell-seed-dev = "shell.config.seed.dev_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shell*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "shell.infrastructure.persistence.sql.models.Base",
    "sqlalchemy.orm.DeclarativeBase",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.ruff.lint.per-file-ignores]
"shell/application/**/dto/*.py" = ["TCH001", "TCH003"]
"shell/framework/user/user/api/*.py" = ["TCH001"]
"**/mappers/__init__.py" = ["F401"]
"**/repositories/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
exclude = []
mypy_path = ["shell/tests/architecture"]

[[tool.mypy.overrides]]
module = [
    "shell.infrastructure.*",
    "shell.framework.*",
    "shell.bootstrap.*",
    "shell.platform.bootstrap.*",
    "shell.platform.framework.*",
    "shell.tests.*",
    "shell.tests.shared.*",
    "shell.config.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "motor.*",
    "asyncpg.*",
    "aiosqlite.*",
    "dependency_injector.*",
    "alembic.*",
    "jwt",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "shell.application.*",
    "shell.process.*",
]
disable_error_code = ["type-abstract"]

[tool.importlinter]
root_package = "shell"

[tool.importlinter.contract.layers]
name = "Clean Architecture Layers"
type = "layers"
layers = [
    "framework",
    "process",
    "bootstrap",
    "infrastructure",
    "application",
    "domain",
]

[tool.importlinter.contract.layers.containers]
framework = "shell.framework"
process = "shell.process"
bootstrap = "shell.bootstrap"
infrastructure = "shell.infrastructure"
application = "shell.application"
domain = "shell.domain"
