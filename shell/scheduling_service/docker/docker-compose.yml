name: shell-scheduling

services:
  shell-scheduling-api:
    build:
      context: ../../..
      dockerfile: shell/scheduling_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SCHEDULING_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/scheduling.db
      SCHEDULING_SERVICE_API_KEY: ${SCHEDULING_SERVICE_API_KEY:?SCHEDULING_SERVICE_API_KEY is required}
      SCHEDULING_SERVICE_BROKER_URL: ${SCHEDULING_SERVICE_BROKER_URL:?SCHEDULING_SERVICE_BROKER_URL is required}
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    networks:
      - shell-net

  shell-scheduling-worker:
    build:
      context: ../../..
      dockerfile: shell/scheduling_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SCHEDULING_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/scheduling.db
      SCHEDULING_SERVICE_API_KEY: ${SCHEDULING_SERVICE_API_KEY:?SCHEDULING_SERVICE_API_KEY is required}
      SCHEDULING_SERVICE_BROKER_URL: ${SCHEDULING_SERVICE_BROKER_URL:?SCHEDULING_SERVICE_BROKER_URL is required}
    command:
      - python
      - -m
      - shell.scheduling_service.bootstrap.scheduling.main
      - --worker
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    depends_on:
      shell-scheduling-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net