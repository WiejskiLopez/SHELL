name: shell-project

services:
  shell-project-api:
    build:
      context: ../../..
      dockerfile: shell/project_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      PROJECT_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/project.db
      PROJECT_SERVICE_API_KEY: ${PROJECT_SERVICE_API_KEY:?PROJECT_SERVICE_API_KEY is required}
      PROJECT_SERVICE_BROKER_URL: ${PROJECT_SERVICE_BROKER_URL:?PROJECT_SERVICE_BROKER_URL is required}
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/readiness')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    networks:
      - shell-net

  shell-project-worker:
    build:
      context: ../../..
      dockerfile: shell/project_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      PROJECT_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/project.db
      PROJECT_SERVICE_API_KEY: ${PROJECT_SERVICE_API_KEY:?PROJECT_SERVICE_API_KEY is required}
      PROJECT_SERVICE_BROKER_URL: ${PROJECT_SERVICE_BROKER_URL:?PROJECT_SERVICE_BROKER_URL is required}
    command:
      - python
      - -m
      - shell.project_service.bootstrap.project.main
      - --worker
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    depends_on:
      shell-project-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net