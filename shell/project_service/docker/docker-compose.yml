name: shell-project

services:
  shell-project-api:
    build:
      context: ../../..
      dockerfile: shell/project_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SHELL_EVENTS_BROKER_URL: amqp://shell:shell@rabbitmq
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - shell-net

  shell-project-worker:
    build:
      context: ../../..
      dockerfile: shell/project_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SHELL_EVENTS_BROKER_URL: amqp://shell:shell@rabbitmq
    command:
      - python
      - -m
      - shell.project_service.bootstrap.project.main
      - --worker
      - --db-url
      - sqlite+aiosqlite:///shell_dev/project.db
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      shell-project-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net