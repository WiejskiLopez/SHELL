name: shell-definition

services:
  shell-definition-api:
    build:
      context: ../../..
      dockerfile: shell/definition_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      DEFINITION_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/definition.db
      DEFINITION_SERVICE_API_KEY: ${DEFINITION_SERVICE_API_KEY:?DEFINITION_SERVICE_API_KEY is required}
      DEFINITION_SERVICE_BROKER_URL: ${DEFINITION_SERVICE_BROKER_URL:?DEFINITION_SERVICE_BROKER_URL is required}
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    networks:
      - shell-net

  shell-definition-worker:
    build:
      context: ../../..
      dockerfile: shell/definition_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      DEFINITION_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/definition.db
      DEFINITION_SERVICE_API_KEY: ${DEFINITION_SERVICE_API_KEY:?DEFINITION_SERVICE_API_KEY is required}
      DEFINITION_SERVICE_BROKER_URL: ${DEFINITION_SERVICE_BROKER_URL:?DEFINITION_SERVICE_BROKER_URL is required}
    command:
      - python
      - -m
      - shell.definition_service.bootstrap.definition.main
      - --worker
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    depends_on:
      shell-definition-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net