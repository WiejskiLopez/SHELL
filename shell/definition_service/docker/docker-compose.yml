services:
  shell-definition-service:
    build:
      context: ../../..
      dockerfile: shell/definition_service/docker/Dockerfile
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../../shell_dev:/app/shell_dev
