services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: shell-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shell
      RABBITMQ_DEFAULT_PASS: shell
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - shell_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shell_rabbitmq_data:
