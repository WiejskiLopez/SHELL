services:
  shell-ingestion-service:
    build:
      context: ../../..
      dockerfile: shell/ingestion_service/docker/Dockerfile
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../../shell_dev:/app/shell_dev
