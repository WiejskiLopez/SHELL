name: shell-user

services:
  shell-user-api:
    build:
      context: ../../..
      dockerfile: shell/user_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      USER_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/user.db
      USER_SERVICE_API_KEY: ${USER_SERVICE_API_KEY:?USER_SERVICE_API_KEY is required}
      USER_SERVICE_BROKER_URL: ${USER_SERVICE_BROKER_URL:?USER_SERVICE_BROKER_URL is required}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    networks:
      - shell-net

  shell-user-worker:
    build:
      context: ../../..
      dockerfile: shell/user_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      USER_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/user.db
      USER_SERVICE_API_KEY: ${USER_SERVICE_API_KEY:?USER_SERVICE_API_KEY is required}
      USER_SERVICE_BROKER_URL: ${USER_SERVICE_BROKER_URL:?USER_SERVICE_BROKER_URL is required}
    command:
      - python
      - -m
      - shell.user_service.bootstrap.user.main
      - --worker
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    depends_on:
      shell-user-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net