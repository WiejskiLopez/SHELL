name: shell-session

services:
  shell-session-api:
    build:
      context: ../../..
      dockerfile: shell/session_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SESSION_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/session.db
      SESSION_SERVICE_BROKER_URL: ${SESSION_SERVICE_BROKER_URL:?SESSION_SERVICE_BROKER_URL is required}
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    networks:
      - shell-net

  shell-session-worker:
    build:
      context: ../../..
      dockerfile: shell/session_service/docker/Dockerfile
    restart: unless-stopped
    environment:
      SESSION_SERVICE_DATABASE_URL: sqlite+aiosqlite:///shell_dev/session.db
      SESSION_SERVICE_BROKER_URL: ${SESSION_SERVICE_BROKER_URL:?SESSION_SERVICE_BROKER_URL is required}
    command:
      - python
      - -m
      - shell.session_service.bootstrap.session.main
      - --worker
    volumes:
      - ./dev_db:/app/shell_dev
      - ./logs:/app/logs
    depends_on:
      shell-session-api:
        condition: service_healthy
    networks:
      - shell-net

networks:
  shell-net:
    name: shell-net