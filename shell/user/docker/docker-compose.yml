services:
  shell-user:
    build:
      context: ../../..
      dockerfile: shell/user/docker/Dockerfile
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../../shell_dev:/app/shell_dev
