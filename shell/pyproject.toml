[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shell-ddd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "motor>=3.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "dependency-injector>=4.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-PyYAML",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["shell/tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI uses `Depends(...)` as default argument value — that's the supported idiom.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.flake8-type-checking]
# SQLAlchemy 2.x Mapped[X] / mapped_column() needs runtime types in DeclarativeBase
# subclasses. Don't move these imports into TYPE_CHECKING blocks.
runtime-evaluated-base-classes = [
    "shell.infrastructure.persistence.sql.models.Base",
    "sqlalchemy.orm.DeclarativeBase",
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = []

# Strict mode applies only to domain + application (Clean Architecture core).
# Outer layers (infrastructure, framework, bootstrap, tests) use standard mypy
# because they bridge dynamic libraries (dependency_injector providers,
# argparse.Namespace, pytest fixtures) where strict checking would require
# excessive type-ignore boilerplate without proportional value.
[[tool.mypy.overrides]]
module = [
    "shell.infrastructure.*",
    "shell.framework.*",
    "shell.bootstrap.*",
    "shell.tests.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "motor.*",
    "asyncpg.*",
    "aiosqlite.*",
    "dependency_injector.*",
    "alembic.*",
]
ignore_missing_imports = true
