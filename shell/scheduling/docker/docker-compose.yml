services:
  shell-scheduling:
    build:
      context: ../../..
      dockerfile: shell/scheduling/docker/Dockerfile
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../../shell_dev:/app/shell_dev
