# Alembic configuration for shell_ddd SQL migrations
[alembic]
# Path to migration scripts (relative to this file)
script_location = infrastructure/persistence/migrations/sql

# Database URL — overridden at runtime via env var or --x arg
# Example: sqlalchemy.url = sqlite+aiosqlite:///shell_ddd.db
sqlalchemy.url = sqlite+aiosqlite:///shell_ddd.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
